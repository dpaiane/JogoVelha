<!DOCTYPE html>
<html>
    by arthur
<head>
    <meta name="viewport" content="width=device-width" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Jogo da Velha</title>
    <style>
        body{ background-color:burlywood; }
        div {
            background-color: cornsilk;
            text-align:center;
            color: black;
            border: 2px solid black;
            border-radius: 15px;
            padding: 10px;
            width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        button {
            transition-duration: 0.4s;
            background-color: cornsilk;
            width: 50px;
            height: 50px;
            border: 0px;
            font-size: 24px;
        }
        button:hover { background-color: red; color: white; }
        table{ border-spacing:0px; margin:auto; }
        td{ border-left:2px solid black; border-top:2px solid black; }
        .td_Direita{ border-left:0px; }
        .td_top{ border-top:0px; }
        #areaJS { position: relative; top:50px; width: 340px; height: 70px; margin-left: auto; margin-right: auto; }
        #area { position: relative; top: 25px; margin-left: auto; margin-right: auto; text-align:center; }
    </style>
</head>
<body onselectstart="return false" oncontextmenu="return false">
    <div>
        <h2>Bem vindo ao nosso Jogo da Velha</h2>
        <p id="data"></p>
    </div>

    <div id="area">
        <table>
            <tr>
                <td class="td_Direita td_top"><button id="1" onclick="jogar(1)"></button></td>
                <td class="td_top"><button id="2" onclick="jogar(2)"></button></td>
                <td class="td_top"><button id="3" onclick="jogar(3)"></button></td>
            </tr>
            <tr>
                <td class="td_Direita"><button id="4" onclick="jogar(4)"></button></td>
                <td><button id="5" onclick="jogar(5)"></button></td>
                <td><button id="6" onclick="jogar(6)"></button></td>
            </tr>
            <tr>
                <td class="td_Direita"><button id="7" onclick="jogar(7)"></button></td>
                <td><button id="8" onclick="jogar(8)"></button></td>
                <td><button id="9" onclick="jogar(9)"></button></td>
            </tr>
        </table>
        <button class="button" onclick="location.reload()">Reset</button>
    </div>

    <div id="areaJS" onclick="FuncaoAviso()">
        <p id="confirmacao">Preencha o formuário para realizar seu cadastro!</p>
    </div>

    <script>
        document.getElementById("data").innerHTML = new Date().toLocaleString();

        function FuncaoAviso() {
            alert('Este é apenas um painel de avisos!');
        }

        let tabuleiro = Array(10).fill(""); // índices 1..9
        let jogadas = 0;
        let fimDeJogo = false;

        function jogar(pos) {
            if (fimDeJogo) {
                alert("O jogo já acabou!");
                return;
            }
            if (tabuleiro[pos] !== "") {
                alert("Escolha outra posição!");
                return;
            }
            tabuleiro[pos] = "X";
            document.getElementById(pos).textContent = "X";
            jogadas++;
            if (verificaVitoria("X")) {
                document.getElementById("data").textContent = "Você Ganhou!!";
                fimDeJogo = true;
                return;
            }
            if (jogadas === 9) {
                document.getElementById("data").textContent = "O jogo Empatou!";
                fimDeJogo = true;
                return;
            }
            roboJoga();
        }

        function roboJoga() {
            // Joga em posição aleatória livre
            let livres = [];
            for(let i=1;i<=9;i++) if(tabuleiro[i]==="") livres.push(i);
            if(livres.length === 0) return;
            let escolha = livres[Math.floor(Math.random()*livres.length)];
            tabuleiro[escolha] = "O";
            document.getElementById(escolha).textContent = "O";
            jogadas++;
            if (verificaVitoria("O")) {
                document.getElementById("data").textContent = "Você Perdeu!!";
                fimDeJogo = true;
                return;
            }
            if (jogadas === 9) {
                document.getElementById("data").textContent = "O jogo Empatou!";
                fimDeJogo = true;
            }
        }

        function verificaVitoria(jogador) {
            const win = [
                [1,2,3],[4,5,6],[7,8,9],
                [1,4,7],[2,5,8],[3,6,9],
                [1,5,9],[3,5,7]
            ];
            return win.some(line => line.every(i => tabuleiro[i] === jogador));
        }
    </script>
</body>
</html>
