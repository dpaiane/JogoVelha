<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Velha</title>
    <style>
        body {
            background-color: burlywood;
            font-family: Arial, sans-serif;
        }

        div {
            background-color: cornsilk;
            text-align: center;
            color: black;
            border: 2px solid black;
            border-radius: 15px;
            padding: 10px;
            width: 340px;
            margin: 20px auto;
        }

        button {
            transition: 0.4s;
            background-color: cornsilk;
            width: 50px;
            height: 50px;
            font-size: 20px;
            border: 1px solid black;
            cursor: pointer;
        }

        button:hover {
            background-color: red;
            color: white;
        }

        table {
            border-spacing: 0;
            margin: auto;
        }

        td {
            border: 2px solid black;
        }

        .no-border-top {
            border-top: none;
        }

        .no-border-left {
            border-left: none;
        }

        #areaJS {
            position: relative;
            top: 30px;
            width: 340px;
            margin: 0 auto;
        }

        .reset-button {
            margin-top: 10px;
            padding: 10px 20px;
            font-size: 16px;
            background-color: black;
            color: white;
            border-radius: 10px;
            border: none;
            cursor: pointer;
        }

        .reset-button:hover {
            background-color: darkred;
        }
    </style>
</head>
<body onselectstart="return false" oncontextmenu="return false">

    <div>
        <h2>Bem-vindo ao Jogo da Velha</h2>
        <p id="data"></p>
    </div>

    <div id="area">
        <table>
            <tr>
                <td class="no-border-left no-border-top"><button id="1" onclick="jogar(1)"></button></td>
                <td class="no-border-top"><button id="2" onclick="jogar(2)"></button></td>
                <td class="no-border-top"><button id="3" onclick="jogar(3)"></button></td>
            </tr>
            <tr>
                <td class="no-border-left"><button id="4" onclick="jogar(4)"></button></td>
                <td><button id="5" onclick="jogar(5)"></button></td>
                <td><button id="6" onclick="jogar(6)"></button></td>
            </tr>
            <tr>
                <td class="no-border-left"><button id="7" onclick="jogar(7)"></button></td>
                <td><button id="8" onclick="jogar(8)"></button></td>
                <td><button id="9" onclick="jogar(9)"></button></td>
            </tr>
        </table>
        <button class="reset-button" onclick="location.reload()">Reiniciar</button>
    </div>

    <div id="areaJS" onclick="FuncaoAviso()">
        <p id="confirmacao">Clique aqui para ver um aviso!</p>
    </div>

    <script>
        const dataAtual = new Date().toLocaleString();
        document.getElementById("data").innerText = dataAtual;

        function FuncaoAviso() {
            alert('Este é apenas um painel de avisos!');
        }

        let tabuleiro = Array(10).fill(0); // Ignora índice 0
        let jogoFinalizado = false;
        let jogadas = 0;

        function jogar(posicao) {
            if (jogoFinalizado || tabuleiro[posicao] !== 0) {
                alert(jogoFinalizado ? "O jogo já acabou!" : "Escolha outra posição!");
                return;
            }

            document.getElementById(posicao).innerText = "X";
            tabuleiro[posicao] = "X";
            jogadas++;

            if (VerificaVitoria("X")) {
                document.getElementById("data").innerText = "Você venceu!";
                jogoFinalizado = true;
                return;
            }

            if (jogadas < 9) {
                RoboJoga();
                jogadas++;
                if (VerificaVitoria("O")) {
                    document.getElementById("data").innerText = "Você perdeu!";
                    jogoFinalizado = true;
                }
            } else {
                document.getElementById("data").innerText = "Empate!";
            }
        }

        function VerificaVitoria(jogador) {
            const vitorias = [
                [1, 2, 3], [4, 5, 6], [7, 8, 9], // Linhas
                [1, 4, 7], [2, 5, 8], [3, 6, 9], // Colunas
                [1, 5, 9], [3, 5, 7]             // Diagonais
            ];

            return vitorias.some(comb => comb.every(i => tabuleiro[i] === jogador));
        }

        function RoboJoga() {
            let jogada = -1;

            // Verifica se pode vencer
            jogada = encontrarMelhorJogada("O");
            if (jogada === -1) {
                // Bloqueia o jogador se necessário
                jogada = encontrarMelhorJogada("X");
            }
            if (jogada === -1) {
                // Caso não tenha jogadas estratégicas, joga aleatório
                const disponiveis = tabuleiro
                    .map((val, idx) => (val === 0 ? idx : null))
                    .filter(idx => idx);
                jogada = disponiveis[Math.floor(Math.random() * disponiveis.length)];
            }

            if (jogada) {
                document.getElementById(jogada).innerText = "O";
                tabuleiro[jogada] = "O";
            }
        }

        function encontrarMelhorJogada(jogador) {
            const combinacoes = [
                [1, 2, 3], [4, 5, 6], [7, 8, 9],
                [1, 4, 7], [2, 5, 8], [3, 6, 9],
                [1, 5, 9], [3, 5, 7]
            ];

            for (let combo of combinacoes) {
                const [a, b, c] = combo;
                const valores = [tabuleiro[a], tabuleiro[b], tabuleiro[c]];
                if (valores.filter(v => v === jogador).length === 2 && valores.includes(0)) {
                    return combo[valores.indexOf(0)];
                }
            }

            return -1;
        }
    </script>

</body>
</html>
